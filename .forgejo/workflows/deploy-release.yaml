name: deploy-release

on:
  schedule:
    - cron: 'CRON_TZ=America/Chicago 0 7 * * *'
  workflow_dispatch:

jobs:
  release:
    runs-on: nix
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: deploy-candidate
          token: ${{ secrets.DEPLOY_TOKEN }}
      - run: git push origin HEAD:deploy
