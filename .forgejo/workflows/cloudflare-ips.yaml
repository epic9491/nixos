name: cloudflare-ips

on:
  schedule:
    - cron: 'CRON_TZ=America/Chicago 23 2 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: nix
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - run: |
          set -eu
          target=machines/server/srv-n2/cloudflare-ips.nix

          run() { nix shell nixpkgs#curl nixpkgs#jq --command "$@"; }
          get() { run curl -fsS --proto '=https' --tlsv1.2 --max-time 30 "$@"; }

          get https://www.cloudflare.com/ips-v4 -o /tmp/ips-v4.raw

          # upstream has no trailing newline
          printf '%s\n' "$(tr -d '\r' < /tmp/ips-v4.raw)" > /tmp/ips-v4

          if grep -qvE '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$' /tmp/ips-v4; then
            echo "refusing: non-CIDR line in upstream list" >&2
            cat /tmp/ips-v4 >&2
            exit 1
          fi

          { echo '['; sed 's/^/  "/; s/$/"/' /tmp/ips-v4; echo ']'; } > /tmp/cloudflare-ips.nix

          if cmp -s /tmp/cloudflare-ips.nix "$target"; then
            echo "Cloudflare ranges unchanged."
            exit 0
          fi

          get https://api.cloudflare.com/client/v4/ips -o /tmp/ips-api.json
          run jq -r '.result.ipv4_cidrs[]' /tmp/ips-api.json | sort > /tmp/new-api
          sort /tmp/ips-v4 > /tmp/new-web

          if ! cmp -s /tmp/new-web /tmp/new-api; then
            echo "refusing: cloudflare.com and api.cloudflare.com disagree" >&2
            diff -u /tmp/new-web /tmp/new-api >&2 || true
            exit 1
          fi

          grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}' "$target" | sort > /tmp/old
          changed=$(diff /tmp/old /tmp/new-web | grep -c '^[<>]' || true)

          if [ "$changed" -gt 2 ]; then
            echo "refusing: $changed ranges changed in one run (cap 2)" >&2
            diff -u /tmp/old /tmp/new-web >&2 || true
            exit 1
          fi

          for anchor in 104.16.0.0/13 172.64.0.0/13 173.245.48.0/20; do
            if ! grep -qxF "$anchor" /tmp/ips-v4; then
              echo "refusing: long-stable range $anchor absent" >&2
              exit 1
            fi
          done

          echo "Cloudflare ranges changed ($changed):"
          diff -u "$target" /tmp/cloudflare-ips.nix || true
          cp /tmp/cloudflare-ips.nix "$target"

          nix build ".#nixosConfigurations.srv-n2.config.system.build.toplevel" --no-link

          git config user.name "Forgejo Actions"
          git config user.email "actions@gaialabs.space"
          git add "$target"
          git commit -m "chore(srv-n2): refresh cloudflare ip ranges"
          git push origin main
